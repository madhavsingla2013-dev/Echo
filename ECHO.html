  function checkAABBCollision(rectA, rectB) {
    return (
      rectA.x < rectB.x + rectB.w &&
      rectA.x + rectA.w > rectB.x &&
      rectA.y < rectB.y + rectB.h &&
      rectA.y + rectA.h > rectB.y
    );
  }

  function checkPointInRect(pointX, pointY, rect) {
    return (
      pointX >= rect.x &&

    );
  }

  function getPlatformRect(p, tick) {
    let x = p.x;
    let y = p.y;
    if (p.movable) {
      const timeVal = tick * PHYSICS.timeStep;
      const offset = Math.sin(timeVal * p.movable.speed) * p.movable.range;
      if (p.movable.axis === 'x') {
        x += offset;
      } else {
        y += offset;
      }
    }
    return { id: p.id, x: x, y: y, w: p.w, h: p.h, movable: p.movable };
  }

  function getJumpPadRect(pad, tick) {
    if (pad.attachedPlatformId !== undefined) {
      const plat = activePlatforms.find(p => p.id === pad.attachedPlatformId);
      if (plat) {
        const pRect = getPlatformRect(plat, tick);
        return {
          x: pRect.x + pad.localX,
          y: pRect.y + pad.localY,
          w: pad.w,
          h: pad.h
        };
      }
    }
    return pad;
  }

          fireBossSlam();
        } else if (hpPct < 0.5) {
          if (Math.random() < 0.5) fireBossVolley(b, hpPct); else fireBossSlam();
        } else {
          if (Math.random() < 0.15) fireBossSlam(); else fireBossVolley(b, hpPct);
        }
        b.state = 'moving';
        b.moveTimer = hpPct < 0.25 ? 1.3 : hpPct < 0.5 ? 1.7 : 2.2;
      }
    }

    const overlapX = player.x < b.x + b.w && player.x + player.w > b.x;
    const overlapY = player.y < b.y + b.h && player.y + player.h > b.y;
    if (!overlapX || !overlapY) return false;

    const playerBottom = player.y + player.h;
    const stomping = player.vy > 40 && (playerBottom - b.y) < 24;

    if (stomping && b.invulnTimer <= 0) {
      const dmg = getPlayerStompDamage() * (powerBoostTimer > 0 ? 2 : 1);
      b.hp = Math.max(0, b.hp - dmg);
      b.invulnTimer = 0.65;
      player.vy = getJumpVelocity() * 0.6;
      spawnDeathParticles(player.x + player.w / 2, b.y);
      if (b.hp <= 0) {
        b.defeated = true;
        spawnDeathParticles(b.x + b.w / 2, b.y + b.h / 2);
        endRun('goal');
        return true;
      }
      if (b.hp / b.maxHp < 0.25 && !b.warnedPhase2) {
        b.warnedPhase2 = true;
        triggerToast('CRIMSON CORE IS ENRAGED! 5-way bursts & slams!', 2.4);
      } else if (b.hp / b.maxHp < 0.5 && !b.warnedPhase1) {
        b.warnedPhase1 = true;
        triggerToast('The boss speeds up and sends hazards!', 2.4);
      } else {
        triggerToast(`Boss hit for ${dmg}! ${b.hp}/${b.maxHp} HP`);
      }
    } else if (playerInvulnTimer <= 0) {
      if (tryAbsorbWithShield()) return false;
      playerHealth -= 20;
      playerInvulnTimer = 1.0;
      player.vx = (player.x + player.w / 2 < b.x + b.w / 2 ? -1 : 1) * 260;
      player.vy = -220;
      if (playerHealth <= 0) {
        triggerToast('Defeated by the boss!');
        endRun('hazard');
        return true;
      }
      triggerToast(`Ouch! ${Math.max(0, Math.round(playerHealth))}/${getPlayerMaxHealth()} HP`);
    }
    return false;
  }

  function fireBossSlam() {
    const spots = [player.x - 30, player.x + 50];
    for (let i = 0; i < spots.length; i++) {
      const sx = Math.max(bossState.minX - 20, Math.min(bossState.maxX + bossState.w - 16, spots[i]));
      bossHazards.push({ x: sx, y: 384, w: 36, h: 16, life: 2.2 });
    }
  }

  function updateBossHazards(dt) {
    for (let i = bossHazards.length - 1; i >= 0; i--) {
      const h = bossHazards[i];
      h.life -= dt;
      if (h.life <= 0) {
        bossHazards.splice(i, 1);
        continue;
      }
      if (hazardImmuneTimer <= 0 && checkAABBCollision(player, h)) {
        if (tryAbsorbWithShield()) {
          bossHazards.splice(i, 1);
          continue;
        }
        if (playerInvulnTimer <= 0) {
          bossHazards.splice(i, 1);
          playerHealth -= 20;
          playerInvulnTimer = 1.0;
          if (playerHealth <= 0) {
            triggerToast('Defeated by the boss!');
            endRun('hazard');
            return true;
          }
          triggerToast(`Burned! ${Math.max(0, Math.round(playerHealth))}/${getPlayerMaxHealth()} HP`);
        }
      }
    }
    return false;
  }

  function fireBossVolley(b, hpPct) {
    const count = hpPct < 0.25 ? 5 : hpPct < 0.5 ? 3 : 1;
    const cx = b.x + b.w / 2, cy = b.y + b.h * 0.3;
    const dx = (player.x + player.w / 2) - cx, dy = (player.y + player.h / 2) - cy;
    const baseAngle = Math.atan2(dy, dx);
    const spread = count > 1 ? 0.55 : 0;
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0 : (i / (count - 1) - 0.5);
      const ang = baseAngle + t * spread;
      bossPellets.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * b.pelletSpeed, vy: Math.sin(ang) * b.pelletSpeed, r: 7
      });
    }
  }

  function updateBossPellets(dt) {
    for (let i = bossPellets.length - 1; i >= 0; i--) {
      const p = bossPellets[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < -20 || p.x > canvas.width + 20 || p.y < -20 || p.y > canvas.height + 20) {
        bossPellets.splice(i, 1);
        continue;
      }
      const pelletBox = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
      if (playerInvulnTimer <= 0 && checkAABBCollision(player, pelletBox)) {
        bossPellets.splice(i, 1);
        if (tryAbsorbWithShield()) continue;
        playerHealth -= bossState.pelletDamage;
        playerInvulnTimer = 0.8;
        player.vy = -160;
        if (playerHealth <= 0) {
          triggerToast('Defeated by the boss!');
          endRun('hazard');
          return true;
        }
        triggerToast(`Grazed! ${Math.max(0, Math.round(playerHealth))}/${getPlayerMaxHealth()} HP`);
      }
    }
    return false;
  }

  function drawBossEntity() {
    if (!bossState || bossState.defeated) return;
    const b = bossState;
    const hpPct = b.hp / b.maxHp;
    const enraged = hpPct < 0.5;
    const flash = b.invulnTimer > 0 && Math.floor(b.invulnTimer * 20) % 2 === 0;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const radius = b.w / 2;

    if (enraged) {
      const pulse = 6 + Math.sin(performance.now() / 90) * 4;
      ctx.fillStyle = hpPct < 0.25 ? 'rgba(255,80,40,0.35)' : 'rgba(255,80,40,0.2)';
      ctx.beginPath();
      ctx.arc(cx, cy, radius + pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    const petalCount = 8;
    ctx.fillStyle = flash ? '#ffffff' : '#e8d23a';
    for (let i = 0; i < petalCount; i++) {
      const ang = (i / petalCount) * Math.PI * 2 + performance.now() / 1000;
      const px = cx + Math.cos(ang) * radius * 1.15;
      const py = cy + Math.sin(ang) * radius * 1.15;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang - 0.16) * radius * 0.7, cy + Math.sin(ang - 0.16) * radius * 0.7);
      ctx.lineTo(px, py);
      ctx.lineTo(cx + Math.cos(ang + 0.16) * radius * 0.7, cy + Math.sin(ang + 0.16) * radius * 0.7);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = flash ? '#ffffff' : (enraged ? '#c0342a' : '#8a1c1c');
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
    ctx.fill();

    const eyeBlink = enraged && Math.floor(performance.now() / 120) % 2 === 0;
    ctx.fillStyle = eyeBlink ? '#fff28a' : '#f4c150';
    ctx.fillRect(cx - radius * 0.35, cy - radius * 0.15, 7, 7);
    ctx.fillRect(cx + radius * 0.15, cy - radius * 0.15, 7, 7);
    ctx.fillStyle = '#12131c';
    ctx.fillRect(cx - radius * 0.35 + 2, cy - radius * 0.15 + 2, 3, 3);
    ctx.fillRect(cx + radius * 0.15 + 2, cy - radius * 0.15 + 2, 3, 3);

    ctx.strokeStyle = '#12131c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy + radius * 0.1, radius * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    if (b.pelletTelegraph > 0) {
      ctx.strokeStyle = '#f4e04d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawBossPellets() {
    for (let i = 0; i < bossPellets.length; i++) {
      const p = bossPellets[i];
      ctx.fillStyle = '#f4e04d';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c99a2e';
      ctx.lineWidth = 1;
      for (let s = 0; s < 6; s++) {
        const ang = (s / 6) * Math.PI * 2 + performance.now() / 300;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(ang) * p.r, p.y + Math.sin(ang) * p.r);
        ctx.lineTo(p.x + Math.cos(ang) * (p.r + 4), p.y + Math.sin(ang) * (p.r + 4));
        ctx.stroke();
      }
    }
  }

  function drawBossHazards() {
    for (let i = 0; i < bossHazards.length; i++) {
      const h = bossHazards[i];
      const flicker = Math.sin(performance.now() / 60 + i) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(225, 90, 74, ${flicker})`;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = `rgba(244, 193, 80, ${flicker})`;
      ctx.fillRect(h.x + 4, h.y - 6, h.w - 8, 6);
      ctx.strokeStyle = '#5c1010';
      ctx.lineWidth = 1;
      ctx.strokeRect(h.x, h.y, h.w, h.h);
    }
  }

  function drawBossHealthBar() {
    if (!bossState) return;
    const barW = 420, barH = 18;
    const x = canvas.width / 2 - barW / 2, y = 40;
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(x - 4, y - 4, barW + 8, barH + 8);
    ctx.fillStyle = '#3a1414';
    ctx.fillRect(x, y, barW, barH);
    const pct = Math.max(0, bossState.hp / bossState.maxHp);
    ctx.fillStyle = '#e14b3d';
    ctx.fillRect(x, y, barW * pct, barH);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, barW, barH);
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(`CRIMSON CORE  ${Math.max(0, bossState.hp)}/${bossState.maxHp}`, canvas.width / 2, y + barH + 15);
  }

  function drawPlayerHealthBar() {
    if (!bossState) return;
    const maxHp = getPlayerMaxHealth();
    const barW = 140, barH = 12;
    const x = 16, y = 44;
    ctx.fillStyle = '#12131c';
    ctx.fillRect(x, y, barW, barH);
    const pct = Math.max(0, playerHealth / maxHp);
    ctx.fillStyle = pct > 0.3 ? '#38b764' : '#e14b3d';
    ctx.fillRect(x, y, barW * pct, barH);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, barW - 1, barH - 1);
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'left';
    ctx.fillText(`HP ${Math.max(0, Math.round(playerHealth))}/${maxHp}`, x, y + barH + 13);
  }

  function useEquippedTool() {
    if (gameState !== 'playing' || isMenuOpen || isTutorial) return;
    if (equippedTool === 'none' || toolCharge <= 0) return;

    if (equippedTool === 'jumppad') {
      toolCharge = 0;
      placedJumpPads.push({ x: player.x - 4, y: player.y + player.h - 12, w: 32, h: 12 });
      triggerToast('Jump pad deployed!');
    } else if (equippedTool === 'echoremover') {
      if (echoes.length > 0) {
        toolCharge = 0;
        echoes.pop();
        triggerToast('Newest echo erased.');
      } else {
        triggerToast('No echoes to erase.');
      }
    } else if (equippedTool === 'speedboost') {
      toolCharge = 0;
      speedBoostTimer = 2.5;
      triggerToast('Speed boost!');
    } else if (equippedTool === 'doublejump') {
      if (player.grounded) {
        triggerToast('Jump first, then press Q in the air.');
      } else {
        toolCharge = 0;
        player.vy = getJumpVelocity();
        triggerToast('Double jump!');
      }
    } else if (equippedTool === 'shield') {
      triggerToast('Shield activates automatically when needed.');
    } else if (equippedTool === 'phasedash') {
      toolCharge = 0;
      player.x += player.facing * 90;
      triggerToast('Phase dash!');
    } else if (equippedTool === 'glide') {
      toolCharge = 0;
      glideTimer = 3.0;
      triggerToast('Glide cape active!');
    } else if (equippedTool === 'nimble') {
      toolCharge = 0;
      hazardImmuneTimer = 2.0;
      triggerToast('Hazard immunity!');
    } else if (equippedTool === 'powergauntlet') {
      toolCharge = 0;
      powerBoostTimer = 5.0;
      triggerToast('Power Gauntlet active! Double stomp damage!');
    }
  }

  function computeCoinReward(levelIndex, echoesUsed, timeTaken, alreadyCompleted) {
    const base = 5 + Math.floor(levelIndex * 0.8);
    const echoBonus = Math.max(0, 4 - echoesUsed);
    const parTime = 6 + levelIndex * 1.5;
    const timeBonus = Math.max(0, Math.round((parTime - timeTaken) * 0.6));
    let reward = base + echoBonus + timeBonus;
    if (alreadyCompleted) reward = Math.round(reward * 0.25);
    return Math.max(alreadyCompleted ? 1 : 3, reward);
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  function spawnCoinFlyParticles(totalReward) {
    coinFlyParticles = [];
    const count = Math.max(3, Math.min(14, Math.round(totalReward / 8)));
    const originX = canvas.width / 2 + 166;
    const originY = 265;
    const targetX = canvas.width - 34;
    const targetY = 21;
    for (let i = 0; i < count; i++) {
      coinFlyParticles.push({
        startX: originX + (Math.random() - 0.5) * 30,
        startY: originY + (Math.random() - 0.5) * 8,
        endX: targetX,
        endY: targetY,
        delay: i * 0.06 + Math.random() * 0.04,
        duration: 0.55 + Math.random() * 0.15
      });
    }
  }

  function updateLevelCompleteAnimation(dt) {
    if (!levelCompleteStats) return;
    coinTallyTimer += dt;
    const duration = 1.3;
    const progress = Math.min(1, coinTallyTimer / duration);
    coinTallyDisplay = Math.round(levelCompleteStats.startCoins + levelCompleteStats.reward * easeOutQuad(progress));
  }

  function tryAbsorbWithShield() {
    if (equippedTool !== 'shield' || toolCharge <= 0) return false;
    toolCharge = 0;
    player.x = levelStartPos.x;
    player.y = levelStartPos.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.groundedObstacle = null;
    recordedFrames = [];
    spawnDeathParticles(player.x + player.w / 2, player.y + player.h / 2);
    triggerToast('Shield absorbed the hit! Back to start, run continues.');
    return true;
  }

  function startTutorial() {
    isTutorial = true;
    tutorialStep = 0;
    activePlatforms = TUTORIAL_LEVEL.platforms;
    currentHazards = [];
    currentJumpPads = [];
    currentPortals = [];
    currentZiplines = [];
    currentGravityZones = [];
    currentGoal = TUTORIAL_LEVEL.goal;
    currentCheckpoint = null;
    currentCheckpointSpawn = null;
    currentRoomDividers = [];
    checkpointPos = null;
    levelStartPos = TUTORIAL_LEVEL.startPos;
    echoes.length = 0;
    particles.length = 0;
    runNumber = 1;
    isMenuOpen = false;
    toolCharge = 0;
    bossState = null;
    startNewRun();
    gameState = 'playing';
  }

  window.addEventListener('keydown', (e) => { keys[e.code] = true; });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;
  });

  canvas.addEventListener('wheel', (e) => {
    if (gameState === 'shop') {
      e.preventDefault();
      shopScrollOffset = Math.max(0, Math.min(shopMaxScroll, shopScrollOffset + e.deltaY * 0.4));
    }
  }, { passive: false });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    if (gameState === 'victory') {
      const btn1 = { x: canvas.width / 2 - 100, y: 270, w: 200, h: 36 };
      const btn2 = { x: canvas.width / 2 - 100, y: 320, w: 200, h: 36 };
      if (checkPointInRect(clickX, clickY, btn1)) {
        goToLevelSelect();
        return;
      }
      if (checkPointInRect(clickX, clickY, btn2)) {
        gameState = 'menu';
        return;
      }
      return;
    }

    if (gameState === 'levelComplete') {
      if (checkPointInRect(clickX, clickY, getLevelCompleteMenuBtnBounds())) {
        levelCompleteStats = null;
        goToLevelSelect();
        return;
      }
      if (checkPointInRect(clickX, clickY, getLevelCompleteNextBtnBounds())) {
        const wasLastLevel = levelCompleteStats && levelCompleteStats.isLastLevel;
        const nextIndex = currentLevelIndex + 1;
        levelCompleteStats = null;
        if (wasLastLevel) {
          gameState = 'victory';
        } else {
          loadLevel(nextIndex);
          gameState = 'playing';
        }
        return;
      }
      return;
    }

    if (gameState === 'menu') {
      if (isSettingsOpen) {
        if (checkPointInRect(clickX, clickY, { x: canvas.width / 2 - 100, y: 180, w: 200, h: 36 })) cyclePlayerColor();
        if (checkPointInRect(clickX, clickY, { x: canvas.width / 2 - 100, y: 230, w: 200, h: 36 })) musicEnabled = !musicEnabled;
        if (checkPointInRect(clickX, clickY, { x: canvas.width / 2 - 100, y: 280, w: 200, h: 36 })) sfxEnabled = !sfxEnabled;
        if (checkPointInRect(clickX, clickY, { x: canvas.width / 2 - 100, y: 340, w: 200, h: 36 })) isSettingsOpen = false;
        return;
      }
      if (checkPointInRect(clickX, clickY, getStartMenuBtnBounds())) { gameState = 'levelSelect'; return; }
      if (checkPointInRect(clickX, clickY, getSettingsMenuBtnBounds())) { isSettingsOpen = true; return; }
      if (checkPointInRect(clickX, clickY, getTutorialMenuBtnBounds())) { startTutorial(); return; }
      if (checkPointInRect(clickX, clickY, getShopMenuBtnBounds())) { gameState = 'shop'; return; }
      return;
    }

    if (gameState === 'shop') {
      if (checkPointInRect(clickX, clickY, getBackButtonBounds())) { gameState = 'menu'; return; }

      if (checkPointInRect(clickX, clickY, getShopTabBounds('hats'))) { shopTab = 'hats'; shopScrollOffset = 0; return; }
      if (checkPointInRect(clickX, clickY, getShopTabBounds('tools'))) { shopTab = 'tools'; shopScrollOffset = 0; return; }
      if (checkPointInRect(clickX, clickY, getShopTabBounds('upgrades'))) { shopTab = 'upgrades'; shopScrollOffset = 0; return; }

      if (shopTab === 'upgrades') {
        const columns = 3, cardW = 230, upgradeCardH = 142, gapX = 20, gapY = 18;
        const gridLeft = (canvas.width - (columns * cardW + (columns - 1) * gapX)) / 2;
        for (let i = 0; i < UPGRADE_ITEMS.length; i++) {
          const col = i % columns;
          const row = Math.floor(i / columns);
          const b = {
            x: gridLeft + col * (cardW + gapX),
            y: 128 - shopScrollOffset + row * (upgradeCardH + gapY),
            w: cardW, h: upgradeCardH
          };
          if (b.y + b.h < 128 || b.y > 400) continue;
          if (checkPointInRect(clickX, clickY, b)) {
            handleUpgradeClick(UPGRADE_ITEMS[i]);
            return;
          }
        }
        return;
      }

      const list = getCurrentShopList();
      for (let i = 0; i < list.length; i++) {
        const b = getShopItemCardBounds(i);
        if (b.y + b.h < 128 || b.y > 400) continue;
        if (checkPointInRect(clickX, clickY, b)) {
          handleShopItemClick(list[i]);
          return;
        }
      }
      return;
    }

    if (gameState === 'levelSelect') {
      if (checkPointInRect(clickX, clickY, getBackButtonBounds())) { gameState = 'menu'; return; }
      
      const totalPages = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
      if (levelSelectPage > 0 && checkPointInRect(clickX, clickY, getPrevArrowBounds())) {
        levelSelectPage--;
        return;
      }
      if (levelSelectPage < totalPages - 1 && checkPointInRect(clickX, clickY, getNextArrowBounds())) {
        levelSelectPage++;
        return;
      }

      const levelPositions = getLevelNodePositions();
      levelPositions.forEach((node) => {
        const dx = clickX - node.x;
        const dy = clickY - node.y;
        if (dx * dx + dy * dy <= node.radius * node.radius && node.index <= highestUnlockedLevel) {
          loadLevel(node.index);
          gameState = 'playing';
        }
      });
      return;
    }

    if (gameState === 'playing') {
      if (checkPointInRect(clickX, clickY, getMenuButtonBounds())) { isMenuOpen = !isMenuOpen; return; }
      if (isMenuOpen) {
        const panel = { x: 260, y: 105, w: 280, h: 210 };
        if (checkPointInRect(clickX, clickY, { x: panel.x + 20, y: panel.y + 40, w: 240, h: 36 })) { isMenuOpen = false; return; }
        if (checkPointInRect(clickX, clickY, { x: panel.x + 20, y: panel.y + 86, w: 240, h: 36 })) { cyclePlayerColor(); return; }
        if (checkPointInRect(clickX, clickY, { x: panel.x + 20, y: panel.y + 132, w: 240, h: 36 })) { goToLevelSelect(); return; }
      }
    }
  });

  function resetPlayerPosition() {
    const spawn = checkpointPos || levelStartPos;
    player.x = spawn.x;
    player.y = spawn.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.groundedObstacle = null;
    player.onZipline = null;
    player.zProgress = 0;
    portalCooldown = 0;
  }

  function enterBossRoom(idx) {
    const room = LEVELS[currentLevelIndex].rooms[idx];
    bossRoomIndex = idx;
    activePlatforms = room.platforms;
    currentHazards = room.hazards || [];
    currentJumpPads = room.jumpPads || [];
    currentPortals = room.portals || [];
    currentZiplines = room.ziplines || [];
    currentGravityZones = room.gravityZones || [];
    currentGoal = room.goal || { x: -200, y: -200, w: 10, h: 10 };
    currentCheckpoint = null;
    currentCheckpointSpawn = null;
    currentRoomDividers = [];
    currentDoor = room.door || null;
    levelStartPos = room.startPos;
    echoes.length = 0;
    particles.length = 0;
    runNumber = 1;
    bossPellets = [];
    bossHazards = [];

    if (idx === 0) {
      checkpointPos = null;
    }

    if (room.boss) {
      bossState = {
        x: room.boss.x, y: room.boss.y, w: room.boss.w, h: room.boss.h,
        minX: room.boss.minX, maxX: room.boss.maxX, speed: room.boss.speed,
        dir: 1, hp: room.boss.maxHp, maxHp: room.boss.maxHp,
        invulnTimer: 0, defeated: false,
        pelletSpeed: room.boss.pelletSpeed || 130, pelletDamage: room.boss.pelletDamage || 20,
        state: 'moving', moveTimer: 2.6, pelletTelegraph: 0,
        warnedPhase1: false, warnedPhase2: false,
        initialX: room.boss.x
      };
      checkpointPos = { x: room.startPos.x, y: room.startPos.y };
    } else {
      bossState = null;
    }

    resetPlayerPosition();
    recordedFrames = [];
    isRecording = true;
    runTickCount = 0;
    placedJumpPads = [];
    speedBoostTimer = 0;
    glideTimer = 0;
    hazardImmuneTimer = 0;
    powerBoostTimer = 0;
    playerHealth = getPlayerMaxHealth();
    playerInvulnTimer = 0;
  }

  function showRoomTransition(label) {
    roomTransitionBanner = { text: label, timer: 1.6 };
  }

  function handleDoorTransition() {
    const rooms = LEVELS[currentLevelIndex].rooms;
    if (bossRoomIndex < rooms.length - 1) {
      const nextIdx = bossRoomIndex + 1;
      enterBossRoom(nextIdx);
      showRoomTransition((rooms[nextIdx].name || 'NEXT ROOM').toUpperCase());
    }
  }

  function startNewRun() {
    const curLevel = LEVELS[currentLevelIndex];
    if (curLevel && curLevel.isBossSequence && !checkpointPos && bossRoomIndex !== 0) {
      enterBossRoom(0);
      return;
    }
    resetPlayerPosition();
    recordedFrames = [];
    isRecording = true;
    runTickCount = 0;
    placedJumpPads = [];
    speedBoostTimer = 0;
    glideTimer = 0;
    hazardImmuneTimer = 0;
    powerBoostTimer = 0;
    playerHealth = getPlayerMaxHealth();
    playerInvulnTimer = 0;
    if (bossState) {
      bossState.x = bossState.initialX;
      bossState.dir = 1;
      bossState.state = 'moving';
      bossState.moveTimer = 2.6;
      bossState.pelletTelegraph = 0;
    }
    bossPellets = [];
    bossHazards = [];

    for (let i = 0; i < echoes.length; i++) {
      const echo = echoes[i];
      echo.index = 0;
      echo.solid = false;
      if (echo.frames.length > 0) {
        echo.x = echo.frames[0].x;
        echo.y = echo.frames[0].y;
      }
    }
  }

  function createEchoFromRun(frames, reason) {
    const fallbackPos = { x: player.x, y: player.y };
    const lastFrame = frames.length > 0 ? frames[frames.length - 1] : fallbackPos;
    const initialFrame = frames.length > 0 ? frames[0] : fallbackPos;

    let attachedPlatId = null;
    let localX = 0;
    let localY = 0;

    if (player.groundedObstacle && player.groundedObstacle.id !== undefined && !player.groundedObstacle.isEcho) {
      attachedPlatId = player.groundedObstacle.id;
      const plat = activePlatforms.find(p => p.id === attachedPlatId);
      if (plat) {
        const platRect = getPlatformRect(plat, runTickCount);
        localX = lastFrame.x - platRect.x;
        localY = (reason === 'fell' ? getFallRestY() : lastFrame.y) - platRect.y;
      } else {
        attachedPlatId = null;
      }
    }

    echoes.push({
      frames: frames,
      index: 0,
      x: initialFrame.x,
      y: initialFrame.y,
      w: player.w,
      h: player.h,
      solid: false,
      restX: lastFrame.x,
      restY: reason === 'fell' ? getFallRestY() : lastFrame.y,
      attachedPlatformId: attachedPlatId,
      localX: localX,
      localY: localY
    });
  }

  function spawnDeathParticles(x, y) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 260,
        vy: -Math.random() * 260,
        life: 0.6 + Math.random() * 0.4
      });
    }
  }

  function endRun(reason) {
    const framesToSave = recordedFrames;
    recordedFrames = [];

    if (reason === 'goal') {
      if (isTutorial) {
        isTutorial = false;
        tutorialCompleted = true;
        goToLevelSelect();
        return;
      }
      const alreadyCompleted = completedLevels.has(currentLevelIndex);
      completedLevels.add(currentLevelIndex);
      if (currentLevelIndex + 1 < LEVELS.length && currentLevelIndex + 1 > highestUnlockedLevel) {
        highestUnlockedLevel = currentLevelIndex + 1;
      }

      const echoesUsed = echoes.length;
      const coinReward = computeCoinReward(currentLevelIndex, echoesUsed, levelElapsedTime, alreadyCompleted);
      const startCoins = coins;
      coins += coinReward;
      saveShopData();

      levelCompleteStats = {
        name: LEVELS[currentLevelIndex].name,
        echoesUsed: echoesUsed,
        timeTaken: levelElapsedTime,
        reward: coinReward,
        startCoins: startCoins,
        isLastLevel: currentLevelIndex === LEVELS.length - 1
      };
      coinTallyDisplay = startCoins;
      coinTallyTimer = 0;
      spawnCoinFlyParticles(coinReward);
      gameState = 'levelComplete';
      return;
    }

    createEchoFromRun(framesToSave, reason);

    if (reason === 'fell') {
      spawnDeathParticles(player.x + player.w / 2, player.y + player.h / 2);
      triggerToast("Fell down! Echo replaying...");
    } else if (reason === 'hazard') {
      spawnDeathParticles(player.x + player.w / 2, player.y + player.h / 2);
      triggerToast("Hit a hazard! Echo replaying...");
    } else {
      triggerToast("Run reset - Echo created.");
    }

    runNumber++;
    startNewRun();
  }

  function loadLevel(index) {
    currentLevelIndex = index;
    const levelData = LEVELS[index];
    isTutorial = false;
    isMenuOpen = false;
    levelElapsedTime = 0;
    toolCharge = equippedTool !== 'none' ? 1 : 0;

    if (levelData.isBossSequence) {
      enterBossRoom(0);
      return;
    }

    activePlatforms = levelData.platforms;
    currentHazards = levelData.hazards || [];
    currentJumpPads = levelData.jumpPads || [];
    currentPortals = levelData.portals || [];
    currentZiplines = levelData.ziplines || [];
    currentGravityZones = levelData.gravityZones || [];
    currentGoal = levelData.goal;
    currentCheckpoint = levelData.checkpoint || null;
    currentCheckpointSpawn = levelData.checkpointSpawn || null;
    currentRoomDividers = levelData.roomDividers || [];
    currentDoor = null;
    checkpointPos = null;
    levelStartPos = levelData.startPos;
    echoes.length = 0;
    particles.length = 0;
    runNumber = 1;
    bossState = null;
    bossPellets = [];
    bossHazards = [];
    startNewRun();
  }

  function goToLevelSelect() {
    gameState = 'levelSelect';
    isMenuOpen = false;
  }

  function getActiveSolidObjects(tick) {
    const solids = [];
    for (let i = 0; i < activePlatforms.length; i++) {
      solids.push(getPlatformRect(activePlatforms[i], tick));
    }
    for (let i = 0; i < echoes.length; i++) {
      if (echoes[i].solid) {
        solids.push({
          id: `echo_${i}`,
          isEcho: true,
          attachedPlatformId: echoes[i].attachedPlatformId,
          x: echoes[i].x,
          y: echoes[i].y,
          w: echoes[i].w,
          h: echoes[i].h
        });
      }
    }
    return solids;
  }

  function moveEntityWithCollisions(entity, deltaX, deltaY, solids) {
    const preY = entity.y;

    entity.x += deltaX;
    for (let i = 0; i < solids.length; i++) {
      const obstacle = solids[i];
      if (checkAABBCollision(entity, obstacle)) {
        if (deltaX > 0) {
          entity.x = obstacle.x - entity.w;
        } else if (deltaX < 0) {
          entity.x = obstacle.x + obstacle.w;
        }
      }
    }

    entity.y += deltaY;
    entity.grounded = false;
    entity.groundedObstacle = null;

    for (let i = 0; i < solids.length; i++) {
      const obstacle = solids[i];
      if (checkAABBCollision(entity, obstacle)) {
        const margin = Math.max(14, Math.abs(deltaY) + 10);
        const wasAbove = (preY + entity.h) <= (obstacle.y + margin);

        if (wasAbove || entity.vy >= 0) {
          entity.y = obstacle.y - entity.h;
          entity.vy = 0;
          entity.grounded = true;
          entity.groundedObstacle = obstacle;
        } else {
          entity.y = obstacle.y + obstacle.h;
          entity.vy = 0;
        }
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += PHYSICS.gravity * 0.6 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function updateGameLogic(dt) {
    if (gameState === 'playing' && !isMenuOpen && !isTutorial) {
      totalGameTime += dt;
      levelElapsedTime += dt;
    }

    runTickCount++;

    if (toastTimer > 0) toastTimer -= dt;
    if (roomTransitionBanner && roomTransitionBanner.timer > 0) {
      roomTransitionBanner.timer -= dt;
      if (roomTransitionBanner.timer <= 0) roomTransitionBanner = null;
    }
    if (portalCooldown > 0) portalCooldown -= dt;
    updateParticles(dt);

    if (gameState === 'levelComplete') {
      updateLevelCompleteAnimation(dt);
      return;
    }

    if (gameState === 'menu' || gameState === 'levelSelect' || gameState === 'victory' || gameState === 'shop') return;

    if (keys['Escape']) {
      keys['Escape'] = false;
      if (isMenuOpen) isMenuOpen = false;
      else goToLevelSelect();
      return;
    }

    if (isMenuOpen) return;

    if (player.grounded && player.groundedObstacle) {
      let obsRect = null;
      if (player.groundedObstacle.isEcho) {
        const echoIdx = parseInt(player.groundedObstacle.id.replace('echo_', ''));
        if (echoes[echoIdx] && echoes[echoIdx].solid) {
          obsRect = { x: echoes[echoIdx].x, y: echoes[echoIdx].y, w: echoes[echoIdx].w, h: echoes[echoIdx].h };
        }
      } else {
        const plat = activePlatforms.find(p => p.id === player.groundedObstacle.id);
        if (plat) {
          obsRect = getPlatformRect(plat, runTickCount - 1);
        }
      }

      if (obsRect && (player.x + player.w <= obsRect.x || player.x >= obsRect.x + obsRect.w)) {
        player.grounded = false;
        player.groundedObstacle = null;
      }
    }

    if (player.grounded && player.groundedObstacle) {
      let targetPlatId = null;
      if (player.groundedObstacle.movable) {
        targetPlatId = player.groundedObstacle.id;
      } else if (player.groundedObstacle.isEcho && player.groundedObstacle.attachedPlatformId !== null) {
        targetPlatId = player.groundedObstacle.attachedPlatformId;
      }

      if (targetPlatId !== null && targetPlatId !== undefined) {
        const plat = activePlatforms.find(p => p.id === targetPlatId);
        if (plat && plat.movable) {
          const pNow = getPlatformRect(plat, runTickCount - 1);
          const pNext = getPlatformRect(plat, runTickCount);
          player.x += (pNext.x - pNow.x);
          player.y += (pNext.y - pNow.y);
        }
      }
    }

    for (let i = 0; i < echoes.length; i++) {
      const echo = echoes[i];
      if (!echo.solid) {
        if (echo.index < echo.frames.length) {
          const frame = echo.frames[echo.index];
          echo.x = frame.x;
          echo.y = frame.y;
          echo.index++;
          if (echo.index >= echo.frames.length) {
            if (echo.attachedPlatformId !== null && echo.attachedPlatformId !== undefined) {
              const plat = activePlatforms.find(p => p.id === echo.attachedPlatformId);
              if (plat) {
                const platRect = getPlatformRect(plat, runTickCount);
                echo.x = platRect.x + echo.localX;
                echo.y = platRect.y + echo.localY;
              } else {
                echo.x = echo.restX;
                echo.y = echo.restY;
              }
            } else {
              echo.x = echo.restX;
              echo.y = echo.restY;
            }
            echo.solid = true;
          }
        }
      } else {
        if (echo.attachedPlatformId !== null && echo.attachedPlatformId !== undefined) {
          const plat = activePlatforms.find(p => p.id === echo.attachedPlatformId);
          if (plat) {
            const platRect = getPlatformRect(plat, runTickCount);
            echo.x = platRect.x + echo.localX;
            echo.y = platRect.y + echo.localY;
          }
        }
      }
    }

    if (speedBoostTimer > 0) speedBoostTimer -= dt;
    if (playerInvulnTimer > 0) playerInvulnTimer -= dt;
    if (hazardImmuneTimer > 0) hazardImmuneTimer -= dt;
    if (powerBoostTimer > 0) powerBoostTimer -= dt;

    if (!player.onZipline) {
      for (let i = 0; i < currentZiplines.length; i++) {
        const z = currentZiplines[i];
        const dx0 = (player.x + player.w / 2) - z.x1;
        const dy0 = (player.y + player.h / 2) - z.y1;
        if (dx0 * dx0 + dy0 * dy0 < 30 * 30) {
          player.onZipline = z;
          player.zProgress = 0;
          break;
        }
      }
    }

    if (player.onZipline) {
      const z = player.onZipline;
      const dx = z.x2 - z.x1, dy = z.y2 - z.y1;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      player.zProgress += (z.speed * dt) / len;
      if (player.zProgress >= 1) {
        player.x = z.x2 - player.w / 2;
        player.y = z.y2 - player.h / 2;
        player.vx = (dx / len) * z.speed;
        player.vy = (dy / len) * z.speed * 0.5;
        player.grounded = false;
        player.onZipline = null;
      } else {
        player.x = z.x1 + dx * player.zProgress - player.w / 2;
        player.y = z.y1 + dy * player.zProgress - player.h / 2;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
      }
    } else {
      let gravityMul = 1;
      for (let i = 0; i < currentGravityZones.length; i++) {
        const g = currentGravityZones[i];
        if (player.x + player.w > g.x && player.x < g.x + g.w && player.y + player.h > g.y && player.y < g.y + g.h) {
          gravityMul = g.multiplier;
          break;
        }
      }
      if (glideTimer > 0) {
        glideTimer -= dt;
        gravityMul *= 0.35;
      }
      player.vy += PHYSICS.gravity * gravityMul * dt;

      let moveDirection = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) moveDirection -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) moveDirection += 1;

      if (moveDirection !== 0) {
        player.facing = moveDirection;
        if (isTutorial && tutorialStep === 0) tutorialStep = 1;
      }

      const speedMultiplier = speedBoostTimer > 0 ? 1.8 : 1;
      player.vx = moveDirection * getMoveSpeedBase() * speedMultiplier;

      if (keys['Space'] && player.grounded) {
        player.vy = getJumpVelocity();
        player.grounded = false;
        player.groundedObstacle = null;
        if (isTutorial && tutorialStep === 1) tutorialStep = 2;
      }

      const solids = getActiveSolidObjects(runTickCount);
      moveEntityWithCollisions(player, player.vx * dt, player.vy * dt, solids);

      if (player.x < 0) { player.x = 0; if (player.vx < 0) player.vx = 0; }
      if (player.x + player.w > canvas.width) { player.x = canvas.width - player.w; if (player.vx > 0) player.vx = 0; }

      for (let i = 0; i < currentJumpPads.length; i++) {
        const pad = getJumpPadRect(currentJumpPads[i], runTickCount);
        if (checkAABBCollision(player, pad)) {
          player.vy = PHYSICS.jumpPadVelocity;
        }
      }

      for (let i = 0; i < placedJumpPads.length; i++) {
        if (checkAABBCollision(player, placedJumpPads[i])) {
          player.vy = PHYSICS.jumpPadVelocity;
        }
      }
    }

    if (portalCooldown <= 0) {
      for (let i = 0; i < currentPortals.length; i++) {
        const port = currentPortals[i];
        if (checkAABBCollision(player, port.entry)) {
          player.x = port.exit.x;
          player.y = port.exit.y;
          player.vy = -350;
          portalCooldown = 0.4;
          spawnDeathParticles(port.entry.x + port.entry.w / 2, port.entry.y + port.entry.h / 2);
          spawnDeathParticles(port.exit.x + 10, port.exit.y + 10);
          triggerToast("Teleported!");
          break;
        }
      }
    }

    if (isTutorial && tutorialStep === 2 && echoes.length > 0) {
      tutorialStep = 3;
    }

    if (isRecording) {
      recordedFrames.push({ x: player.x, y: player.y, tick: runTickCount });
    }

    if (isRecording && currentCheckpoint && !checkpointPos && checkAABBCollision(player, currentCheckpoint)) {
      checkpointPos = currentCheckpointSpawn || { x: player.x, y: player.y };
      playerHealth = getPlayerMaxHealth();
      triggerToast('Checkpoint reached! Boss ahead...', 2.2);
    }

    if (isRecording && currentDoor && checkAABBCollision(player, currentDoor)) {
      handleDoorTransition();
      return;
    }

    if (isRecording && bossState && !bossState.defeated) {
      const bossEnded = updateBoss(dt);
      if (bossEnded) return;
    }

    if (isRecording && checkAABBCollision(player, currentGoal)) {
      endRun('goal');
      return;
    }

    if (isRecording) {
      for (let i = 0; i < currentHazards.length; i++) {
        const hzDef = currentHazards[i];
        if (!isHazardActive(hzDef, runTickCount)) continue;
        const hz = getPlatformRect(hzDef, runTickCount);
        if (checkAABBCollision(player, hz)) {
          if (hazardImmuneTimer > 0) continue;
          if (tryAbsorbWithShield()) return;
          endRun('hazard');
          return;
        }
      }
    }

    if (isRecording && player.y > getFallRestY()) {
      if (tryAbsorbWithShield()) return;
      endRun('fell');
      return;
    }

    if (keys['KeyR']) {
      keys['KeyR'] = false;
      endRun('reset');
      return;
    }

    if (keys['KeyQ']) {
      keys['KeyQ'] = false;
      useEquippedTool();
    }
  }

  function drawBackgroundPattern() {
    ctx.fillStyle = PALETTE.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = PALETTE.bgDot;
    for (let x = 12; x < canvas.width; x += 24) {
      for (let y = 12; y < canvas.height; y += 24) ctx.fillRect(x, y, 2, 2);
    }
  }

  function drawScanlines() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
    for (let y = 0; y < canvas.height; y += 4) ctx.fillRect(0, y, canvas.width, 1);
  }

  function drawCharacterSprite(x, y, w, h, bodyColor, eyeColor, facingDirection, hat) {
    ctx.fillStyle = bodyColor;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
    const eyeOffsetX = facingDirection >= 0 ? w - 9 : 5;
    ctx.fillStyle = eyeColor;
    ctx.fillRect(Math.round(x + eyeOffsetX), Math.round(y + 8), 4, 4);
    if (hat && hat !== 'none') drawHat(hat, Math.round(x), Math.round(y), w, h);
  }

  function drawHat(hat, x, y, w, h) {
    const cx = x + w / 2;
    if (hat === 'cap') {
      ctx.fillStyle = '#e14b3d';
      ctx.fillRect(x - 2, y - 6, w + 4, 7);
      ctx.fillRect(x + w - 4, y - 3, 10, 4);
    } else if (hat === 'tophat') {
      ctx.fillStyle = '#12131c';
      ctx.fillRect(x - 3, y - 4, w + 6, 4);
      ctx.fillRect(x + 3, y - 16, w - 6, 13);
      ctx.fillStyle = '#41a6f6';
      ctx.fillRect(x + 3, y - 8, w - 6, 3);
    } else if (hat === 'crown') {
      ctx.fillStyle = '#f4c150';
      ctx.fillRect(x, y - 8, w, 6);
      ctx.fillRect(x, y - 12, 4, 6);
      ctx.fillRect(x + w / 2 - 2, y - 14, 4, 8);
      ctx.fillRect(x + w - 4, y - 12, 4, 6);
      ctx.fillStyle = '#e14b3d';
      ctx.fillRect(x + w / 2 - 1, y - 12, 2, 2);
    } else if (hat === 'halo') {
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(cx, y - 10, 10, 4, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (hat === 'visor') {
      ctx.fillStyle = '#12131c';
      ctx.fillRect(x - 1, y + 5, w + 2, 8);
      ctx.fillStyle = '#41d6f6';
      ctx.fillRect(x + 2, y + 7, w - 4, 4);
    } else if (hat === 'wizard') {
      const brimY = y - 1;
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath();
      ctx.ellipse(cx, brimY, w * 0.72, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#4a3620';
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.3, brimY);
      ctx.quadraticCurveTo(cx - w * 0.08, y - h * 0.55, cx + w * 0.1, y - h * 0.68);
      ctx.quadraticCurveTo(cx + w * 0.42, y - h * 0.78, cx + w * 0.38, y - h * 0.58);
      ctx.quadraticCurveTo(cx + w * 0.14, y - h * 0.32, cx + w * 0.3, brimY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.26, brimY - 3);
      ctx.lineTo(cx + w * 0.24, brimY - 3);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (hat === 'ninja') {
      ctx.fillStyle = '#12131c';
      ctx.fillRect(x - 1, y - 4, w + 2, 14);
      ctx.fillStyle = '#41d6f6';
      ctx.fillRect(x + 2, y + 4, w - 4, 3);
      ctx.fillStyle = '#12131c';
      ctx.fillRect(x + w - 2, y + 8, 8, 4);
    } else if (hat === 'flowercrown') {
      ctx.fillStyle = '#38b764';
      ctx.beginPath();
      ctx.ellipse(cx, y - 2, w * 0.55, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      const petalColors = ['#f47fc4', '#f4c150', '#41a6f6'];
      for (let i = 0; i < 5; i++) {
        const ang = (i / 5) * Math.PI * 2;
        const px = cx + Math.cos(ang) * w * 0.5;
        const py = y - 2 + Math.sin(ang) * 4;
        ctx.fillStyle = petalColors[i % petalColors.length];
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (hat === 'bandana') {
      ctx.fillStyle = '#e14b3d';
      ctx.fillRect(x - 2, y - 3, w + 4, 8);
      ctx.fillStyle = '#a5241a';
      ctx.fillRect(x + w - 2, y - 1, 6, 10);
    } else if (hat === 'explorer') {
      ctx.fillStyle = '#c99a5a';
      ctx.beginPath();
      ctx.ellipse(cx, y + 1, w * 0.75, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#a5793a';
      ctx.fillRect(cx - w * 0.32, y - 12, w * 0.64, 13);
      ctx.fillStyle = '#7a5a2a';
      ctx.fillRect(cx - w * 0.32, y - 2, w * 0.64, 4);
    } else if (hat === 'crimsonhelm') {
      ctx.fillStyle = '#8a1c1c';
      ctx.fillRect(x - 2, y - 8, w + 4, 14);
      ctx.fillStyle = '#5c1010';
      ctx.fillRect(x - 2, y - 8, w + 4, 4);
      ctx.fillStyle = '#f4c150';
      ctx.beginPath();
      ctx.moveTo(cx, y - 20);
      ctx.lineTo(cx - 5, y - 8);
      ctx.lineTo(cx + 5, y - 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#12131c';
      ctx.fillRect(x + 2, y - 2, w - 4, 4);
    }
  }

  function drawEchoObject(echo) {
    const renderX = Math.round(echo.x);
    const renderY = Math.round(echo.y);
    if (echo.solid) {
      ctx.fillStyle = PALETTE.echoSolidFill;
      ctx.fillRect(renderX, renderY, echo.w, echo.h);
      ctx.strokeStyle = PALETTE.echoSolidEdge;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(renderX + 0.5, renderY + 0.5, echo.w - 1, echo.h - 1);
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = PALETTE.echoGhostFill;
      ctx.fillRect(renderX, renderY, echo.w, echo.h);
    }
  }

  function isHazardActive(hz, tick) {
    if (!hz.blink) return true;
    const t = (tick * PHYSICS.timeStep + (hz.blink.phase || 0)) % hz.blink.interval;
    return t < hz.blink.onDuration;
  }

  function drawHazard(hz, active) {
    if (active === false) {
      ctx.globalAlpha = 0.25;
    }
    ctx.fillStyle = PALETTE.hazard;
    ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
    ctx.fillStyle = PALETTE.hazardEdge;
    const spikeCount = Math.max(1, Math.floor(hz.w / 8));
    const spikeW = hz.w / spikeCount;
    for (let i = 0; i < spikeCount; i++) {
      ctx.beginPath();
      ctx.moveTo(hz.x + i * spikeW, hz.y);
      ctx.lineTo(hz.x + i * spikeW + spikeW / 2, hz.y - 7);
      ctx.lineTo(hz.x + (i + 1) * spikeW, hz.y);
      ctx.closePath();
      ctx.fill();
    }
    if (active === false) {
      ctx.globalAlpha = 1;
    }
  }

  function drawJumpPads() {
    for (let i = 0; i < currentJumpPads.length; i++) {
      const pad = getJumpPadRect(currentJumpPads[i], runTickCount);
      ctx.fillStyle = PALETTE.jumpPad;
      ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      ctx.fillStyle = PALETTE.jumpPadTop;
      ctx.fillRect(pad.x, pad.y, pad.w, 4);
    }
    for (let i = 0; i < placedJumpPads.length; i++) {
      const pad = placedJumpPads[i];
      ctx.fillStyle = '#a15ff4';
      ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      ctx.fillStyle = '#d6b3ff';
      ctx.fillRect(pad.x, pad.y, pad.w, 4);
    }
  }

  function drawPortals() {
    const timeVal = performance.now() / 200;
    for (let i = 0; i < currentPortals.length; i++) {
      const port = currentPortals[i];
      const entry = port.entry;

      ctx.fillStyle = port.color || PALETTE.portal;
      ctx.beginPath();
      ctx.ellipse(entry.x + entry.w / 2, entry.y + entry.h / 2, entry.w / 2, entry.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const pulse = 2 + Math.sin(timeVal) * 2;
      ctx.ellipse(entry.x + entry.w / 2, entry.y + entry.h / 2, Math.max(1, entry.w / 4 - pulse), Math.max(1, entry.h / 4 - pulse), 0, 0, Math.PI * 2);
      ctx.fill();

      const exit = port.exit;
      ctx.strokeStyle = port.color || PALETTE.portal;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(exit.x, exit.y, player.w, player.h);
      ctx.setLineDash([]);
    }
  }

  function drawDoorMarker() {
    if (!currentDoor) return;
    const d = currentDoor;
    const glow = 4 + Math.sin(performance.now() / 300) * 3;
    ctx.fillStyle = 'rgba(244, 193, 80, 0.25)';
    ctx.fillRect(d.x - glow, d.y - glow, d.w + glow * 2, d.h + glow * 2);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(d.x - 6, d.y - 6, d.w + 12, d.h + 6);
    ctx.fillStyle = '#f4c150';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = '#8a1c1c';
    ctx.fillRect(d.x + 4, d.y + 6, d.w - 8, d.h - 12);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = '#f4c150';
    ctx.textAlign = 'center';
    ctx.fillText('DOOR', d.x + d.w / 2, d.y - 12);
  }

  function drawTreasureChest(cx, groundY, big) {
    const w = big ? 60 : 42, h = big ? 34 : 24;
    const x = cx - w / 2, y = groundY - h;
    ctx.fillStyle = '#5c3a1a';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#3a2410';
    ctx.fillRect(x, y, w, h * 0.35);
    ctx.fillStyle = '#f4c150';
    ctx.fillRect(x, y + h * 0.35 - 2, w, 3);
    ctx.fillRect(x + w / 2 - 3, y + h * 0.35, 6, h * 0.5);
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);
    const glow = 4 + Math.sin(performance.now() / 250 + cx) * 2;
    ctx.fillStyle = `rgba(244, 193, 80, 0.35)`;
    ctx.beginPath();
    ctx.arc(cx, y - 2, glow + 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCoinPile(cx, groundY) {
    const coinColors = ['#f4c150', '#e8b040', '#f4c150'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = coinColors[i];
      ctx.strokeStyle = '#c99a2e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx - 8 + i * 8, groundY - 4 - (i === 1 ? 4 : 0), 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawBossRoomDecor() {
    const curLevel = LEVELS[currentLevelIndex];
    const room = curLevel && curLevel.rooms ? curLevel.rooms[bossRoomIndex] : null;
    if (!curLevel || !curLevel.isBossSequence || !room || !room.isTreasureRoom) return;
    const bob = Math.sin(performance.now() / 400) * 4;

    drawTreasureChest(110, 400, true);
    drawTreasureChest(690, 400, true);
    drawTreasureChest(400, 400, false);
    drawCoinPile(160, 400);
    drawCoinPile(250, 400);
    drawCoinPile(550, 400);
    drawCoinPile(640, 400);

    const gemSpots = [
      { x: 60, y: 330 }, { x: 210, y: 300 }, { x: 320, y: 335 },
      { x: 480, y: 335 }, { x: 590, y: 300 }, { x: 740, y: 330 }
    ];
    for (let i = 0; i < gemSpots.length; i++) {
      const g = gemSpots[i];
      const gy = g.y + bob * (i % 2 === 0 ? 1 : -1);
      const isGem = i % 2 === 0;
      ctx.fillStyle = isGem ? '#41d6f6' : '#f4c150';
      ctx.strokeStyle = isGem ? '#1c7a9c' : '#c99a2e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (isGem) {
        ctx.moveTo(g.x, gy - 7);
        ctx.lineTo(g.x + 6, gy);
        ctx.lineTo(g.x, gy + 7);
        ctx.lineTo(g.x - 6, gy);
        ctx.closePath();
      } else {
        ctx.arc(g.x, gy, 6, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
    }

    const torchXs = [40, 760];
    for (let i = 0; i < torchXs.length; i++) {
      const tx = torchXs[i];
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(tx - 5, 245, 10, 60);
      ctx.fillRect(tx - 5, 235, 10, 10);
      ctx.fillStyle = 'rgba(255,150,60,0.5)';
      ctx.beginPath();
      ctx.arc(tx, 232, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(396, 300, 8, 30);

    const signX = 400, signTop = 205, signW = 280, signH = 105;
    ctx.fillStyle = 'rgba(20, 12, 12, 0.88)';
    ctx.fillRect(signX - signW / 2, signTop, signW, signH);
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 2;
    ctx.strokeRect(signX - signW / 2, signTop, signW, signH);

    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = '#f4c150';
    ctx.textAlign = 'center';
    ctx.fillText('CRIMSON CORE', signX, signTop + 20);
    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#e8d8c0';
    const lines = [
      'Stomp its head to deal damage.',
      'Avoid its body, pellets & fire patches.',
      'Under 50% HP: 3-way bursts or slams.',
      'Under 25% HP: 5-way bursts + slams!',
      'Boss hits hurt a LOT - upgrade first!'
    ];
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], signX, signTop + 38 + i * 13);
    }
  }

  function drawCheckpointMarker() {
    if (!currentCheckpoint) return;
    const c = currentCheckpoint;
    const reached = !!checkpointPos;
    const cx = c.x + c.w / 2;
    const poleTopY = c.y - 6;
    ctx.strokeStyle = reached ? PALETTE.completed : '#5a6988';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, c.y + c.h);
    ctx.lineTo(cx, poleTopY);
    ctx.stroke();

    const bob = Math.sin(performance.now() / 250) * 3;
    ctx.fillStyle = reached ? PALETTE.completed : '#7a82a8';
    ctx.beginPath();
    ctx.moveTo(cx, poleTopY + bob);
    ctx.lineTo(cx + 20, poleTopY + 6 + bob);
    ctx.lineTo(cx, poleTopY + 12 + bob);
    ctx.closePath();
    ctx.fill();

    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillStyle = reached ? PALETTE.completed : '#9aa0b8';
    ctx.textAlign = 'center';
    ctx.fillText(reached ? 'CHECKPOINT' : 'CHECKPOINT AHEAD', cx, c.y - 16);
  }

  function drawZiplines() {
    for (let i = 0; i < currentZiplines.length; i++) {
      const z = currentZiplines[i];
      ctx.strokeStyle = '#9aa0b8';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(z.x1, z.y1);
      ctx.lineTo(z.x2, z.y2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#f4c150';
      ctx.beginPath();
      ctx.arc(z.x1, z.y1, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#41a6f6';
      ctx.beginPath();
      ctx.arc(z.x2, z.y2, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGravityZones() {
    for (let i = 0; i < currentGravityZones.length; i++) {
      const g = currentGravityZones[i];
      const isLow = g.multiplier < 1;
      ctx.fillStyle = isLow ? 'rgba(65, 166, 246, 0.16)' : 'rgba(161, 95, 244, 0.18)';
      ctx.fillRect(g.x, g.y, g.w, g.h);
      ctx.strokeStyle = isLow ? 'rgba(65, 166, 246, 0.5)' : 'rgba(161, 95, 244, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.strokeRect(g.x, g.y, g.w, g.h);
      ctx.setLineDash([]);
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillStyle = isLow ? '#7fc4f6' : '#c79bf6';
      ctx.textAlign = 'center';
      ctx.fillText(isLow ? 'LOW-G' : 'HIGH-G', g.x + g.w / 2, g.y + 16);
    }
  }

  function drawToastNotification() {
    if (toastTimer <= 0 || isTutorial) return;

    ctx.font = '13px "Courier New", monospace';
    ctx.globalAlpha = Math.min(1, toastTimer);
    ctx.fillStyle = PALETTE.hudPanel;
    const textWidth = ctx.measureText(toastMessage).width + 24;
    ctx.fillRect(canvas.width / 2 - textWidth / 2, 44, textWidth, 26);
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'center';
    ctx.fillText(toastMessage, canvas.width / 2, 61);
    ctx.globalAlpha = 1;
  }

  function drawCoinBadge(rightEdgeX, y, overrideValue) {
    const value = overrideValue !== undefined ? overrideValue : coins;
    const text = `${value}`;
    ctx.font = 'bold 13px "Courier New", monospace';
    const w = ctx.measureText(text).width + 40;
    const x = rightEdgeX - w;
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(x, y, w, 26);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 25);
    ctx.beginPath();
    ctx.fillStyle = '#f4c150';
    ctx.arc(x + 16, y + 13, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#c99a2e';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, x + 28, y + 17);
  }

  function drawHUDOverlay() {
    const activeEchoCount = echoes.filter(e => e.solid).length;
    const label = isTutorial ? 'TUTORIAL' : `${LEVELS[currentLevelIndex].name.toUpperCase()} (${currentLevelIndex + 1}/${LEVELS.length})`;
    let hudString = `${label}   RUN ${runNumber}   ECHOES: ${activeEchoCount}/${echoes.length}`;
    if (equippedTool !== 'none' && !isTutorial) {
      const readyLabel = toolCharge > 0 ? (equippedTool === 'shield' ? 'READY' : 'READY (Q)') : 'USED';
      hudString += `   ${getToolDisplayName(equippedTool).toUpperCase()}: ${readyLabel}`;
    }

    ctx.font = '13px "Courier New", monospace';
    const panelWidth = Math.max(320, ctx.measureText(hudString).width + 20);
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(8, 8, panelWidth, 28);
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'left';
    ctx.fillText(hudString, 16, 27);

    if (!isTutorial) drawCoinBadge(canvas.width - 50, 8);
  }

  function drawBackButton() {
    const btn = getBackButtonBounds();
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 1;
    ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'center';
    ctx.fillText('< BACK', btn.x + btn.w / 2, btn.y + btn.h / 2 + 4);
  }

  function drawMenuButton() {
    const btn = getMenuButtonBounds();
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 1;
    ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
    ctx.fillStyle = PALETTE.hudText;
    for (let i = 0; i < 3; i++) ctx.fillRect(btn.x + 6, btn.y + 7 + i * 7, btn.w - 12, 3);
  }

  function drawPauseMenu() {
    ctx.fillStyle = 'rgba(13, 14, 20, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const panel = { x: 260, y: 105, w: 280, h: 210 };
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 2;
    ctx.strokeRect(panel.x + 1, panel.y + 1, panel.w - 2, panel.h - 2);
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', panel.x + panel.w / 2, panel.y + 30);

    const renderButton = (bounds, label) => {
      ctx.fillStyle = '#1a1c2c';
      ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.strokeStyle = PLAYER_COLORS[playerColorIndex];
      ctx.lineWidth = 1;
      ctx.strokeRect(bounds.x + 0.5, bounds.y + 0.5, bounds.w - 1, bounds.h - 1);
      ctx.font = '13px "Courier New", monospace';
      ctx.fillStyle = PALETTE.hudText;
      ctx.textAlign = 'center';
      ctx.fillText(label, bounds.x + bounds.w / 2, bounds.y + bounds.h / 2 + 5);
    };

    renderButton({ x: panel.x + 20, y: panel.y + 40, w: 240, h: 36 }, 'RESUME');
    renderButton({ x: panel.x + 20, y: panel.y + 86, w: 240, h: 36 }, 'CHANGE COLOR');
    renderButton({ x: panel.x + 20, y: panel.y + 132, w: 240, h: 36 }, 'LEVEL SELECT');

    const colorBtn = { x: panel.x + 20, y: panel.y + 86, w: 240, h: 36 };
    ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
    ctx.fillRect(colorBtn.x + colorBtn.w - 26, colorBtn.y + 10, 16, 16);
  }

  function drawVictoryScreen() {
    drawBackgroundPattern();

    ctx.fillStyle = 'rgba(13, 14, 20, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00b4d8';
    ctx.fillRect(180, 75, 440, 28);

    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffca36';
    ctx.fillText('THANK YOU FOR PLAYING', canvas.width / 2, 145);

    ctx.fillStyle = '#00b4d8';
    ctx.fillRect(180, 195, 440, 18);

    const mins = Math.floor(totalGameTime / 60);
    const secs = Math.floor(totalGameTime % 60);

      ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.fillStyle = PALETTE.hudText;

      ctx.fillText(text, bounds.x + bounds.w / 2, bounds.y + 23);

    renderMenuBtn({ x: canvas.width / 2 - 100, y: 270, w: 200, h: 36 }, 'LEVEL SELECT');

    drawScanlines();
  }

  function drawLevelCompleteScreen() {
    drawBackgroundPattern();

    if (!levelCompleteStats) {
      drawScanlines();
      return;
    }

    ctx.fillStyle = PALETTE.completed;
    ctx.fillRect(150, 58, 500, 36);
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#12131c';
    ctx.fillText('LEVEL COMPLETE', canvas.width / 2, 83);

    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
    ctx.fillText(levelCompleteStats.name.toUpperCase(), canvas.width / 2, 118);

    const panel = { x: canvas.width / 2 - 190, y: 140, w: 380, h: 150 };
    ctx.fillStyle = PALETTE.hudPanel;
    ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
    ctx.strokeStyle = '#0d0e14';
    ctx.lineWidth = 2;
    ctx.strokeRect(panel.x + 1, panel.y + 1, panel.w - 2, panel.h - 2);

    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = PALETTE.hudText;
    ctx.textAlign = 'left';
    ctx.fillText('ECHOES USED:', panel.x + 24, panel.y + 38);
    ctx.fillText('TIME TAKEN:', panel.x + 24, panel.y + 68);

    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`${levelCompleteStats.echoesUsed}`, panel.x + panel.w - 24, panel.y + 38);
    ctx.fillText(`${levelCompleteStats.timeTaken.toFixed(1)}s`, panel.x + panel.w - 24, panel.y + 68);

    ctx.strokeStyle = '#3a3f55';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(panel.x + 16, panel.y + 90);
    ctx.lineTo(panel.x + panel.w - 16, panel.y + 90);
    ctx.stroke();

    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.fillStyle = '#f4c150';
    ctx.textAlign = 'left';
    ctx.fillText('COINS EARNED:', panel.x + 24, panel.y + 125);
    ctx.textAlign = 'right';
    ctx.fillText(`+${levelCompleteStats.reward}`, panel.x + panel.w - 24, panel.y + 125);

    drawCoinBadge(canvas.width - 8, 8, coinTallyDisplay);

    for (let i = 0; i < coinFlyParticles.length; i++) {
      const p = coinFlyParticles[i];
      const localT = coinTallyTimer - p.delay;
      if (localT < 0 || localT > p.duration) continue;
      const pr = Math.min(1, localT / p.duration);
      const px = lerp(p.startX, p.endX, pr);
      const py = lerp(p.startY, p.endY, pr) - Math.sin(pr * Math.PI) * 44;
      const scale = 1 - pr * 0.35;
      ctx.beginPath();
      ctx.fillStyle = '#f4c150';
      ctx.arc(px, py, 5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c99a2e';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const menuBtn = getLevelCompleteMenuBtnBounds();
    const nextBtn = getLevelCompleteNextBtnBounds();
    const renderBtn = (b, text, accent) => {
      ctx.fillStyle = PALETTE.hudPanel;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillStyle = PALETTE.hudText;
      ctx.textAlign = 'center';
      ctx.fillText(text, b.x + b.w / 2, b.y + b.h / 2 + 5);
    };
    renderBtn(menuBtn, 'LEVEL MENU', '#5a6988');
    renderBtn(nextBtn, levelCompleteStats.isLastLevel ? 'FINISH' : 'NEXT LEVEL', PALETTE.completed);

    drawScanlines();
  }
