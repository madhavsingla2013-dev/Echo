  function wrapText(text, cx, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let curY = y;
    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && line !== '') {
        ctx.fillText(line.trim(), cx, curY);
        line = words[i] + ' ';
        curY += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line.trim(), cx, curY);
  }

  function drawShopItemIcon(item, cx, cy) {
    if (item.id === 'none') {
      ctx.strokeStyle = '#5a6988';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.stroke();
      return;
    }
    if (item.id === 'cap' || item.id === 'tophat' || item.id === 'crown' || item.id === 'halo' || item.id === 'visor' || item.id === 'wizard' || item.id === 'bandana' || item.id === 'ninja' || item.id === 'flowercrown' || item.id === 'explorer' || item.id === 'crimsonhelm') {
      ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
      ctx.fillRect(cx - 10, cy - 6, 20, 20);
      drawHat(item.id, cx - 10, cy - 6, 20, 20);
      return;
    }
    if (item.id === 'phasedash') {
      ctx.strokeStyle = '#a15ff4';
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(cx - 14, cy);
      ctx.lineTo(cx + 8, cy);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(cx + 4, cy - 8);
      ctx.lineTo(cx + 14, cy);
      ctx.lineTo(cx + 4, cy + 8);
      ctx.stroke();
      return;
    }
    if (item.id === 'jumppad') {
      ctx.fillStyle = PALETTE.jumpPad;
      ctx.fillRect(cx - 14, cy + 4, 28, 10);
      ctx.fillStyle = PALETTE.jumpPadTop;
      ctx.fillRect(cx - 14, cy + 4, 28, 3);
      return;
    }
    if (item.id === 'echoremover') {
      ctx.fillStyle = PALETTE.echoSolidFill;
      ctx.fillRect(cx - 12, cy - 8, 24, 30);
      ctx.strokeStyle = '#e14b3d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 12, cy - 8);
      ctx.lineTo(cx + 12, cy + 22);
      ctx.moveTo(cx + 12, cy - 8);
      ctx.lineTo(cx - 12, cy + 22);
      ctx.stroke();
      return;
    }
    if (item.id === 'speedboost') {
      ctx.strokeStyle = PALETTE.jumpPadTop;
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - 14 + i * 4, cy - 10 + i * 8);
        ctx.lineTo(cx + 6 + i * 4, cy - 10 + i * 8);
        ctx.stroke();
      }
      return;
    }
    if (item.id === 'doublejump') {
      ctx.strokeStyle = '#41a6f6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy + 8);
      ctx.lineTo(cx, cy - 2);
      ctx.lineTo(cx + 10, cy + 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy - 4);
      ctx.lineTo(cx, cy - 14);
      ctx.lineTo(cx + 10, cy - 4);
      ctx.stroke();
      return;
    }
    if (item.id === 'shield') {
      ctx.fillStyle = '#38b764';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 14);
      ctx.lineTo(cx + 12, cy - 6);
      ctx.lineTo(cx + 9, cy + 12);
      ctx.lineTo(cx, cy + 18);
      ctx.lineTo(cx - 9, cy + 12);
      ctx.lineTo(cx - 12, cy - 6);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1c5c34';
      ctx.lineWidth = 2;
      ctx.stroke();
      return;
    }
    if (item.id === 'glide') {
      ctx.fillStyle = '#41a6f6';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 14);
      ctx.lineTo(cx + 16, cy + 10);
      ctx.lineTo(cx, cy + 4);
      ctx.lineTo(cx - 16, cy + 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1c4c7a';
      ctx.lineWidth = 1;
      ctx.stroke();
      return;
    }
    if (item.id === 'nimble') {
      ctx.strokeStyle = '#f4c150';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, 13, -0.4, Math.PI * 1.3);
      ctx.stroke();
      ctx.fillStyle = '#f4c150';
      ctx.beginPath();
      ctx.arc(cx + 12, cy - 8, 3, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    if (item.id === 'powergauntlet') {
      ctx.fillStyle = '#c0342a';
      ctx.fillRect(cx - 10, cy - 4, 20, 16);
      ctx.fillStyle = '#8a1c1c';
      ctx.fillRect(cx - 10, cy - 10, 6, 8);
      ctx.fillRect(cx - 2, cy - 12, 6, 10);
      ctx.fillRect(cx + 6, cy - 10, 6, 8);
      ctx.fillStyle = '#f4c150';
      ctx.strokeStyle = '#f4c150';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy + 2);
      ctx.lineTo(cx + 5, cy - 8);
      ctx.lineTo(cx + 1, cy - 8);
      ctx.lineTo(cx + 6, cy - 16);
      ctx.stroke();
      return;
    }
  }

  function drawShopScreen() {
    drawBackgroundPattern();
    drawBackButton();
    drawCoinBadge(canvas.width - 8, 8);

    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0d0e14';
    ctx.fillText('SHOP', canvas.width / 2 + 4, 59);
    ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
    ctx.fillText('SHOP', canvas.width / 2, 55);

    const tabs = [{ id: 'hats', label: 'HATS' }, { id: 'tools', label: 'TOOLS' }, { id: 'upgrades', label: 'UPGRADES' }];
    for (let t = 0; t < tabs.length; t++) {
      const tab = tabs[t];
      const b = getShopTabBounds(tab.id);
      ctx.fillStyle = shopTab === tab.id ? PLAYER_COLORS[playerColorIndex] : PALETTE.hudPanel;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#0d0e14';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillStyle = shopTab === tab.id ? '#0d0e14' : PALETTE.hudText;
      ctx.textAlign = 'center';
      ctx.fillText(tab.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
    }

    const gridTop = 128, gridBottom = 400;
    const columns = 3, cardW = 230, cardH = 112, gapX = 20, gapY = 18;
    const gridLeft = (canvas.width - (columns * cardW + (columns - 1) * gapX)) / 2;
    const gridRight = gridLeft + columns * cardW + (columns - 1) * gapX;

    if (shopTab === 'upgrades') {
      const upgradeCardH = cardH + 30;
      const rows = Math.ceil(UPGRADE_ITEMS.length / columns);
      const contentH = rows * (upgradeCardH + gapY) - gapY;
      shopMaxScroll = Math.max(0, contentH - (gridBottom - gridTop));
      if (shopScrollOffset > shopMaxScroll) shopScrollOffset = shopMaxScroll;

      ctx.save();
      ctx.beginPath();
      ctx.rect(gridLeft - 6, gridTop - 6, gridRight - gridLeft + 12, gridBottom - gridTop + 12);
      ctx.clip();

      for (let i = 0; i < UPGRADE_ITEMS.length; i++) {
        const item = UPGRADE_ITEMS[i];
        const col = i % columns;
        const row = Math.floor(i / columns);
        const b = {
          x: gridLeft + col * (cardW + gapX),
          y: gridTop - shopScrollOffset + row * (upgradeCardH + gapY),
          w: cardW, h: upgradeCardH
        };
        if (b.y + b.h < gridTop || b.y > gridBottom) continue;
        const tier = upgrades[item.id] || 0;
        const maxed = tier >= item.prices.length;
        const price = maxed ? 0 : item.prices[tier];

        ctx.fillStyle = PALETTE.hudPanel;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = maxed ? PALETTE.completed : PLAYER_COLORS[playerColorIndex];
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

        ctx.font = 'bold 14px "Courier New", monospace';
        ctx.fillStyle = PALETTE.hudText;
        ctx.textAlign = 'center';
        ctx.fillText(item.name, b.x + b.w / 2, b.y + 26);

        ctx.font = '11px "Courier New", monospace';
        ctx.fillStyle = '#9aa0b8';
        wrapText(item.desc, b.x + b.w / 2, b.y + 46, b.w - 24, 13);

        for (let d = 0; d < item.prices.length; d++) {
          const dotX = b.x + b.w / 2 - (item.prices.length - 1) * 10 + d * 20;
          ctx.beginPath();
          ctx.arc(dotX, b.y + 88, 6, 0, Math.PI * 2);
          ctx.fillStyle = d < tier ? PALETTE.completed : '#3a3f55';
          ctx.fill();
        }

        ctx.font = 'bold 12px "Courier New", monospace';
        if (maxed) {
          ctx.fillStyle = PALETTE.completed;
          ctx.fillText('MAXED OUT', b.x + b.w / 2, b.y + b.h - 10);
        } else {
          ctx.fillStyle = coins >= price ? '#f4c150' : '#e14b3d';
          ctx.fillText(`${price} COINS - TIER ${tier + 1}/${item.prices.length}`, b.x + b.w / 2, b.y + b.h - 10);
        }
      }
      ctx.restore();
      drawShopScrollbar(gridRight + 16, gridTop, gridBottom);
    } else {
      const list = getCurrentShopList();
      const owned = getOwnedListRef();
      const equippedId = getEquippedId();
      const rows = Math.ceil(list.length / columns);
      const contentH = rows * (cardH + gapY) - gapY;
      shopMaxScroll = Math.max(0, contentH - (gridBottom - gridTop));
      if (shopScrollOffset > shopMaxScroll) shopScrollOffset = shopMaxScroll;

      ctx.save();
      ctx.beginPath();
      ctx.rect(gridLeft - 6, gridTop - 6, gridRight - gridLeft + 12, gridBottom - gridTop + 12);
      ctx.clip();

      for (let i = 0; i < list.length; i++) {
        const item = list[i];
        const b = getShopItemCardBounds(i);
        if (b.y + b.h < gridTop || b.y > gridBottom) continue;
        const isOwned = owned.includes(item.id) || item.price === 0;
        const isEquipped = equippedId === item.id;

        ctx.fillStyle = PALETTE.hudPanel;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = isEquipped ? PALETTE.completed : (isOwned ? PLAYER_COLORS[playerColorIndex] : '#3a3f55');
        ctx.lineWidth = isEquipped ? 3 : 2;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

        drawShopItemIcon(item, b.x + b.w / 2, b.y + 28);

        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillStyle = PALETTE.hudText;
        ctx.textAlign = 'center';
        ctx.fillText(item.name, b.x + b.w / 2, b.y + 60);

        ctx.font = '10px "Courier New", monospace';
        ctx.fillStyle = '#9aa0b8';
        wrapText(item.desc, b.x + b.w / 2, b.y + 74, b.w - 24, 11);

        ctx.font = 'bold 12px "Courier New", monospace';
        if (isEquipped) {
          ctx.fillStyle = PALETTE.completed;
          ctx.fillText('EQUIPPED', b.x + b.w / 2, b.y + b.h - 8);
        } else if (isOwned) {
          ctx.fillStyle = '#38b764';
          ctx.fillText('OWNED - CLICK TO EQUIP', b.x + b.w / 2, b.y + b.h - 8);
        } else {
          ctx.fillStyle = coins >= item.price ? '#f4c150' : '#e14b3d';
          ctx.fillText(`${item.price} COINS - CLICK TO BUY`, b.x + b.w / 2, b.y + b.h - 8);
        }
      }
      ctx.restore();
      drawShopScrollbar(gridRight + 16, gridTop, gridBottom);
    }

    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#7a82a8';
    ctx.textAlign = 'center';
    ctx.fillText('earn coins by completing levels', canvas.width / 2, 425);

    drawScanlines();
  }

  function drawShopScrollbar(x, top, bottom) {
    if (shopMaxScroll <= 0) return;
    const trackH = bottom - top;
    ctx.fillStyle = '#12131c';
    ctx.fillRect(x, top, 10, trackH);
    ctx.strokeStyle = '#3a3f55';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, top + 0.5, 9, trackH - 1);
    const thumbH = Math.max(28, trackH * (trackH / (trackH + shopMaxScroll)));
    const thumbY = top + (trackH - thumbH) * (shopScrollOffset / shopMaxScroll);
    ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
    ctx.fillRect(x + 1, thumbY, 8, thumbH);
    ctx.fillStyle = '#12131c';
    for (let ny = thumbY + 5; ny < thumbY + thumbH - 4; ny += 6) {
      ctx.fillRect(x + 2, ny, 6, 2);
    }
  }

  function getLevelNodePositions() {
    const columns = 5;
    const radius = 22;
    const spacingX = 130;
    const spacingY = 88;
    const startX = (canvas.width - (columns - 1) * spacingX) / 2;
    const startY = 130;
    const nodes = [];

    const pageStartIndex = levelSelectPage * LEVELS_PER_PAGE;
    const pageEndIndex = Math.min(pageStartIndex + LEVELS_PER_PAGE, LEVELS.length);

    for (let i = pageStartIndex; i < pageEndIndex; i++) {
      const pageOffset = i - pageStartIndex;
      const col = pageOffset % columns;
      const row = Math.floor(pageOffset / columns);
      nodes.push({ x: startX + col * spacingX, y: startY + row * spacingY, radius: radius, index: i });
    }
    return nodes;
  }

  function drawCrownIcon(x, y) {
    ctx.fillStyle = '#f4c150';
    ctx.fillRect(x - 10, y - 2, 20, 6);
    ctx.fillRect(x - 10, y - 10, 4, 10);
    ctx.fillRect(x - 2, y - 13, 4, 13);
    ctx.fillRect(x + 6, y - 10, 4, 10);
    ctx.strokeStyle = '#c99a2e';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 10, y - 2, 20, 6);
  }

  function drawLockIcon(x, y) {
    ctx.fillStyle = '#12131c';
    ctx.fillRect(x - 6, y - 12, 4, 10);
    ctx.fillRect(x + 2, y - 12, 4, 10);
    ctx.fillRect(x - 6, y - 14, 12, 4);
    ctx.fillRect(x - 9, y - 2, 18, 14);

    ctx.fillStyle = '#3a3f55';
    ctx.fillRect(x - 2, y + 3, 4, 6);
  }

  function drawCompletionCheckmark(x, y, radius) {
    const badgeX = x + radius - 6;
    const badgeY = y - radius + 6;
    ctx.fillStyle = '#1a1c2c';
    ctx.fillRect(badgeX - 8, badgeY - 8, 16, 16);
    ctx.fillStyle = PALETTE.completed;
    
    ctx.fillRect(badgeX - 4, badgeY, 2, 2);
    ctx.fillRect(badgeX - 2, badgeY + 2, 2, 2);
    ctx.fillRect(badgeX, badgeY + 4, 2, 2);
    ctx.fillRect(badgeX + 2, badgeY + 2, 2, 2);
    ctx.fillRect(badgeX + 4, badgeY, 2, 2);
    ctx.fillRect(badgeX + 6, badgeY - 2, 2, 2);
  }

  function drawPixelArrow(x, y, dir) {
    ctx.fillStyle = PALETTE.hudText;
    if (dir === 'left') {
      ctx.fillRect(x + 12, y + 8, 12, 24);
      ctx.fillRect(x + 8, y + 12, 4, 16);
      ctx.fillRect(x + 4, y + 16, 4, 8);
    } else {
      ctx.fillRect(x + 8, y + 8, 12, 24);
      ctx.fillRect(x + 20, y + 12, 4, 16);
      ctx.fillRect(x + 24, y + 16, 4, 8);
    }
  }

  function drawProgressBar() {
    const totalLevels = LEVELS.length;
    const completedCount = completedLevels.size;
    
    const barWidth = 360;
    const gap = 4;
    const segmentWidth = (barWidth - gap * (totalLevels - 1)) / totalLevels;
    const segmentHeight = 14;
    
    const startX = canvas.width / 2 - barWidth / 2;
    const startY = 385;

    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#9aa0b8';
    ctx.textAlign = 'center';
    ctx.fillText(`PROGRESS: ${completedCount}/${totalLevels} LEVELS COMPLETE`, canvas.width / 2, startY - 8);

    for (let i = 0; i < totalLevels; i++) {
      const currentX = startX + i * (segmentWidth + gap);

      ctx.fillStyle = i < completedCount ? PALETTE.completed : '#2a2d42';
      ctx.fillRect(currentX, startY, segmentWidth, segmentHeight);

      ctx.strokeStyle = '#0d0e14';
      ctx.lineWidth = 1;
      ctx.strokeRect(currentX + 0.5, startY + 0.5, segmentWidth - 1, segmentHeight - 1);
    }
  }

  function drawLevelSelectScreen() {
    drawBackgroundPattern();
    drawBackButton();

    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0d0e14';
    ctx.fillText('SELECT LEVEL', canvas.width / 2 + 4, 59);
    ctx.fillStyle = PLAYER_COLORS[playerColorIndex];
    ctx.fillText('SELECT LEVEL', canvas.width / 2, 55);

    drawCoinBadge(canvas.width - 8, 8);

    const totalPages = Math.ceil(LEVELS.length / LEVELS_PER_PAGE);
    
    if (levelSelectPage > 0) {
      const prev = getPrevArrowBounds();
      drawPixelArrow(prev.x, prev.y, 'left');
    }
    if (levelSelectPage < totalPages - 1) {
      const next = getNextArrowBounds();
      drawPixelArrow(next.x, next.y, 'right');
    }

    const nodes = getLevelNodePositions();
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const isUnlocked = node.index <= highestUnlockedLevel;
      const isCompleted = completedLevels.has(node.index);
      const isBoss = LEVELS[node.index] && LEVELS[node.index].isBoss;

      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
      ctx.fillStyle = !isUnlocked ? PALETTE.locked : (isBoss ? '#c0342a' : PLAYER_COLORS[playerColorIndex]);
      ctx.fill();
      ctx.closePath();

      if (isBoss && isUnlocked) {
        ctx.strokeStyle = '#f4c150';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (isUnlocked) {
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = '#0d0e14';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(node.index + 1), node.x, node.y + 1);
        ctx.textBaseline = 'alphabetic';
        if (isBoss) drawCrownIcon(node.x, node.y - node.radius - 10);
        if (isCompleted) drawCompletionCheckmark(node.x, node.y, node.radius);
      } else {
        drawLockIcon(node.x, node.y);
      }
    }

    drawProgressBar();

    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#7a82a8';
    ctx.textAlign = 'center';
    ctx.fillText('click an unlocked level to play', canvas.width / 2, 425);

    drawScanlines();
  }

  function drawGameplayScreen() {
    const isBossLevel = !isTutorial && LEVELS[currentLevelIndex] && LEVELS[currentLevelIndex].isBoss;
    drawBackgroundPattern();
    if (isBossLevel) {
      ctx.fillStyle = 'rgba(180, 20, 20, 0.16)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 40, canvas.width / 2, canvas.height / 2, 420);
      grad.addColorStop(0, 'rgba(120,0,0,0)');
      grad.addColorStop(1, 'rgba(90,0,0,0.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    drawGravityZones();

    for (let i = 0; i < activePlatforms.length; i++) {
      const p = activePlatforms[i];
      const rect = getPlatformRect(p, runTickCount);
      ctx.fillStyle = p.movable ? (isBossLevel ? '#c14b3d' : PALETTE.platformMoving) : (isBossLevel ? '#5c1c1c' : PALETTE.platform);
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = isBossLevel ? '#e15a4a' : PALETTE.platformEdge;
      ctx.fillRect(rect.x, rect.y, rect.w, 3);
    }

    drawZiplines();
    drawJumpPads();
    drawPortals();
    drawDoorMarker();
    drawBossRoomDecor();

    for (let i = 0; i < currentHazards.length; i++) {
      const hzDef = currentHazards[i];
      drawHazard(getPlatformRect(hzDef, runTickCount), isHazardActive(hzDef, runTickCount));
    }

    if (!isBossLevel) {
      ctx.fillStyle = PALETTE.goal;
      ctx.fillRect(currentGoal.x, currentGoal.y, currentGoal.w, currentGoal.h);
      ctx.fillStyle = PALETTE.goalEdge;
      ctx.fillRect(currentGoal.x, currentGoal.y, currentGoal.w, 3);
    }

    drawBossEntity();
    drawBossPellets();
    drawBossHazards();

    for (let i = 0; i < echoes.length; i++) if (!echoes[i].solid) drawEchoObject(echoes[i]);
    for (let i = 0; i < echoes.length; i++) if (echoes[i].solid) drawEchoObject(echoes[i]);

    const playerFlicker = playerInvulnTimer > 0 && Math.floor(playerInvulnTimer * 16) % 2 === 0;
    if (!playerFlicker) {
      drawCharacterSprite(player.x, player.y, player.w, player.h, PLAYER_COLORS[playerColorIndex], PALETTE.playerEye, player.facing, equippedHat);
    }

    ctx.fillStyle = PALETTE.particle;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
      ctx.globalAlpha = 1;
    }

    drawHUDOverlay();
    drawBossHealthBar();
    drawPlayerHealthBar();

    if (isTutorial) {
      ctx.font = '13px "Courier New", monospace';
      ctx.fillStyle = '#ffca36';
      ctx.textAlign = 'center';
      let promptText = '';
      if (tutorialStep === 0) promptText = "NARRATOR: Use A/D or Arrow keys to move left and right!";
      else if (tutorialStep === 1) promptText = "NARRATOR: Press Space to jump over obstacles!";
      else if (tutorialStep === 2) promptText = "NARRATOR: Fall into the gap to leave an Echo platform!";
      else promptText = "NARRATOR: Use your solid Echo as a bridge to reach the goal!";
      ctx.fillText(promptText, canvas.width / 2, 60);
    }

    drawMenuButton();
    drawScanlines();

    if (isMenuOpen) drawPauseMenu();
  }

  function render() {
    if (gameState === 'victory') drawVictoryScreen();
    else if (gameState === 'levelComplete') drawLevelCompleteScreen();
    else if (gameState === 'menu') drawMainMenu();
    else if (gameState === 'levelSelect') drawLevelSelectScreen();
    else if (gameState === 'shop') drawShopScreen();
    else drawGameplayScreen();

    if ((gameState === 'playing' && !isMenuOpen) || gameState === 'shop') drawToastNotification();
    if (gameState === 'playing' && roomTransitionBanner) drawRoomTransitionBanner();
  }

  function drawRoomTransitionBanner() {
    const b = roomTransitionBanner;
    const fadeIn = Math.min(1, (1.6 - b.timer) / 0.3);
    const fadeOut = Math.min(1, b.timer / 0.3);
    const alpha = Math.min(fadeIn, fadeOut);
    ctx.fillStyle = `rgba(10, 6, 6, ${0.55 * alpha})`;
    ctx.fillRect(0, 170, canvas.width, 90);
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(244, 193, 80, ${alpha})`;
    ctx.fillText('ENTERING', canvas.width / 2, 205);
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillStyle = `rgba(232, 216, 192, ${alpha})`;
    ctx.fillText(b.text, canvas.width / 2, 240);
  }

  let lastFrameTime = performance.now();
  let accumulator = 0;

  function gameLoop(currentTime) {
    const deltaTime = (currentTime - lastFrameTime) / 1000;
    lastFrameTime = currentTime;
    accumulator += deltaTime;

    while (accumulator >= PHYSICS.timeStep) {
      updateGameLogic(PHYSICS.timeStep);
      accumulator -= PHYSICS.timeStep;
    }

    render();
    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
